name: release-desktop

# 桌面客户端（Tauri）发布：推 v* tag 触发，六个平台/架构并行构建，
# 产物直接挂到同名的 GitHub Release 上。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build desktop app (${{ matrix.target }})
        working-directory: desktop
        env:
          RUSTUP_DIST_SERVER: https://rsproxy.cn
          RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
        shell: bash
        run: |
          npm install --no-audit --no-fund --registry=https://registry.npmmirror.com @tauri-apps/cli@^2
          npx tauri build --target ${{ matrix.target }}

      - name: Ensure release exists (with notes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Freebuff Proxy Desktop $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md

      - name: Upload bundles to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          [ -d "$BUNDLE_DIR" ] || BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          FILES=$(find "$BUNDLE_DIR" -type f \( \
            -name "*-setup.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) \
            ! -iname "*uninstall*" ! -iname "*-debug*")
          echo "uploading:"; echo "$FILES"
          [ -n "$FILES" ] && gh release upload "$GITHUB_REF_NAME" $FILES \
            --clobber --repo "$GITHUB_REPOSITORY"
